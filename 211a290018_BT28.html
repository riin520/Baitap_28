<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Kiểm Tra Tốc Độ</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #f4f4f9;
        margin-top: 30px;
      }
      .info-panel {
        display: flex;
        justify-content: space-between;
        width: 600px;
        margin-bottom: 20px;
        font-size: 20px;
        font-weight: bold;
      }

      #startBtn {
        padding: 10px 25px;
        font-size: 18px;
        cursor: pointer;
        background-color: #27ae60;
        color: white;
        border: none;
        border-radius: 5px;
        margin-bottom: 20px;
        font-weight: bold;
        transition: 0.3s;
      }
      #startBtn:hover {
        background-color: #2ecc71;
      }
      #startBtn:disabled {
        background-color: #95a5a6;
        cursor: not-allowed;
      }

      #arena {
        width: 600px;
        height: 400px;
        background-color: #2c3e50;
        position: relative;
        border: 3px solid #34495e;
        overflow: hidden;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }

      /* Mục tiêu (Hình tròn nhỏ) */
      #target {
        width: 40px;
        height: 40px;
        background-color: #e74c3c;
        border-radius: 50%;
        position: absolute;
        cursor: crosshair;
        display: none;
        box-shadow: 0 0 10px rgba(231, 76, 60, 0.8);
      }
    </style>
  </head>
  <body>
    <h2>Bài Tập 28 - Game Kiểm Tra Tốc Độ</h2>
    <div class="info-panel">
      <div>Điểm số: <span id="score">0</span></div>
      <div>Thời gian: <span id="time">30</span> giây</div>
    </div>

    <!-- Nút Bắt đầu -->
    <button id="startBtn">Bắt đầu trò chơi</button>

    <!-- Khu vực chơi -->
    <div id="arena">
      <div id="target"></div>
    </div>

    <script>
      // Các biến lưu trữ trạng thái game
      let score = 0;
      let timeLeft = 30;
      let gameTimer; // Đếm ngược 30s
      let moveTimer; // Hẹn giờ đổi vị trí mục tiêu

      const arena = document.getElementById("arena");
      const target = document.getElementById("target");
      const scoreDisplay = document.getElementById("score");
      const timeDisplay = document.getElementById("time");
      const startBtn = document.getElementById("startBtn");

      const arenaWidth = 600;
      const arenaHeight = 400;
      const targetSize = 40;

      // Hàm di chuyển mục tiêu ngẫu nhiên
      function moveTarget() {
        const randomLeft = Math.floor(
          Math.random() * (arenaWidth - targetSize),
        );
        const randomTop = Math.floor(
          Math.random() * (arenaHeight - targetSize),
        );

        target.style.left = randomLeft + "px";
        target.style.top = randomTop + "px";
      }

      // Hàm bắt đầu game
      function startGame() {
        // 1. Reset điểm và thời gian
        score = 0;
        timeLeft = 30;
        scoreDisplay.textContent = score;
        timeDisplay.textContent = timeLeft;

        // Khóa nút bấm để tránh click nhiều lần
        startBtn.disabled = true;

        // Hiện mục tiêu và đặt vị trí ban đầu
        target.style.display = "block";
        moveTarget();

        // 2. Đếm ngược thời gian (chạy mỗi 1 giây)
        gameTimer = setInterval(() => {
          timeLeft--;
          timeDisplay.textContent = timeLeft;

          // Nếu hết giờ
          if (timeLeft <= 0) {
            endGame();
          }
        }, 1000);

        // Sinh mục tiêu ngẫu nhiên mỗi 1 giây nếu không click
        moveTimer = setInterval(moveTarget, 1000);
      }

      // Xử lý sự kiện khi click TRÚNG mục tiêu
      target.addEventListener("mousedown", function () {
        if (timeLeft > 0) {
          // Tăng điểm
          score++;
          scoreDisplay.textContent = score;

          // Đổi vị trí
          moveTarget();

          // Reset bộ đếm
          clearInterval(moveTimer);
          moveTimer = setInterval(moveTarget, 1000);
        }
      });

      // Hàm kết thúc game
      function endGame() {
        clearInterval(gameTimer);
        clearInterval(moveTimer);
        target.style.display = "none";
        startBtn.disabled = false;

        alert("HẾT GIỜ! \nTổng số điểm của bạn là: " + score);
      }

      startBtn.addEventListener("click", startGame);
    </script>
  </body>
</html>
